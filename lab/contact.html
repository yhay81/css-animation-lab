<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>css-animation-lab — 一覧・評価</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="contact.css">
</head>
<body>

<header class="workspace-header">
  <div class="identity-row">
    <a class="identity" href="contact.html" aria-current="page">
      <span class="identity-mark" aria-hidden="true"></span>
      <span>CSS ANIMATION LAB</span>
    </a>
    <nav class="view-nav" aria-label="ラボの表示">
      <a href="contact.html" aria-current="page">評価</a>
      <a href="strip.html">ストリップ</a>
      <a href="verify.html">検証</a>
    </nav>
    <span class="spacer"></span>
    <div class="progress" aria-live="polite">
      <span class="todo">要判断 <b id="c-todo">0</b></span>
      <span>却下 <b id="c-veto">0</b></span>
      <span>気になる <b id="c-flag">0</b></span>
      <span>手本 <b id="c-star">0</b></span>
    </div>
    <button class="saved" id="saved" type="button" aria-live="polite" title="保存に失敗した場合は再試行">読込中</button>
    <button class="text-button" id="export-verdicts" type="button" hidden
      title="自分の判定を JSON で書き出す。プルリクエストで送ると集計に加わる">判定を書き出す</button>
  </div>

  <div class="control-row" aria-label="再生条件">
    <label>イージング <select id="ease"></select></label>
    <label>被写体 <select id="substrate"></select></label>
    <label class="range-label">速さ
      <input id="speed" type="range" min="300" max="3000" step="50" value="1000">
      <output id="speed-out">×1.0</output>
    </label>
    <label class="range-label">時刻
      <input id="scrub" type="range" min="0" max="1000" step="1" value="0">
    </label>
    <button id="play" class="icon-button" type="button" aria-label="一時停止" title="再生 / 一時停止">⏸</button>
    <label class="check-label" title="1周の終わりに間を置く"><input type="checkbox" id="hold"> 溜め</label>
    <span id="mode" class="mode-copy"></span>
  </div>

  <div class="filter-row" aria-label="実験の絞り込み">
    <label class="search-label">
      <span class="sr-only">検索</span>
      <input id="query" type="search" placeholder="ID・名称・用途・技法を検索" autocomplete="off">
    </label>
    <label><span class="sr-only">層</span><select id="layer"></select></label>
    <label><span class="sr-only">駆動方式</span><select id="filter-mode"></select></label>
    <label><span class="sr-only">事前予測</span><select id="prediction"></select></label>
    <label><span class="sr-only">判定</span><select id="verdict"></select></label>
    <label class="axis-label"><span class="sr-only">索引軸</span><select id="axis"></select></label>
    <button id="clear-filters" class="text-button" type="button">解除</button>
    <span class="shown"><b id="shown-count">0</b> / <span id="total-count">0</span> 件</span>
  </div>
</header>

<details class="shortcuts">
  <summary>キー操作と駆動方式</summary>
  <div>
    <kbd>←↑↓→</kbd> 移動　<kbd>p</kbd> 採用　<kbd>x</kbd> 却下　<kbd>f</kbd> 気になる　<kbd>s</kbd> 手本　<kbd>z</kbd> 取消　
    <kbd>n</kbd> 次の要判断　<kbd>Enter</kbd> 拡大　<kbd>Space</kbd> 再生／停止　<kbd>,</kbd> <kbd>.</kbd> コマ送り　
    <kbd>r</kbd> 頭出し　<kbd>e</kbd> イージング　<kbd>b</kbd> 被写体　<kbd>t</kbd> 既定反転
  </div>
  <p><b>keyframes</b> は共通時計、<b>state</b> は実時間の開閉、<b>scroll</b> はセル内のスクロール、<b>interactive</b> はポインターやフォーム操作で駆動します。</p>
</details>

<div class="veil" id="veil" hidden></div>
<main>
  <div class="empty" id="empty" hidden>条件に合う実験がありません。絞り込みを解除してください。</div>
  <div class="grid" id="grid"></div>
</main>

<script>
  if (location.protocol === 'file:') {
    document.body.insertAdjacentHTML('beforeend',
      '<div style="position:fixed;left:16px;right:16px;bottom:16px;padding:14px 16px;' +
      'border:1px solid #f43f5e;border-radius:10px;background:#2a0f1c;color:#ffe4e6;' +
      'font:13px/1.9 ui-sans-serif,system-ui,sans-serif">' +
      'file:// では動きません。<br>ターミナルで <code>npm start</code> を起動し、' +
      '<a href="http://127.0.0.1:5757/lab/contact.html" style="color:#7dd3fc">http://127.0.0.1:5757/lab/contact.html</a> から開いてください。</div>');
  }
</script>
<script type="module" src="contact.js"></script>
</body>
</html>
