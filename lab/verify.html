<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>css-animation-lab — 検証</title>
<link rel="stylesheet" href="common.css">
<style>
  .vbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    padding: 10px 14px; background: #0e132a; border-bottom: 1px solid #2a3150;
    font-size: 12px;
  }
  .vbar b { font-size: 13px; }
  .vbar a { color: #8b93b5; text-decoration: none; }
  .vbar a:hover, .vbar a:focus-visible { color: #e6e9f5; }
  .vbar .current { color: #7dd3fc; }
  .vbar .spacer { flex: 1; }
  .tally { display: flex; gap: 10px; }
  .tally span { padding: 2px 9px; border-radius: 999px; font-weight: 700; }
  .t-fail { background: #4c0519; color: #fecdd3; }
  .t-warn { background: #422006; color: #fde68a; }
  .t-ok   { background: #052e1a; color: #a7f3d0; }
  .t-skip { background: #172554; color: #bfdbfe; }

  .metrics, .compat {
    margin: 12px 14px 0;
    border-top: 1px solid #2a3150;
    border-bottom: 1px solid #2a3150;
    background: #10162a;
  }
  .metrics {
    display: flex; flex-wrap: wrap; gap: 18px;
    padding: 10px 12px; color: #8b93b5; font-size: 11px;
  }
  .metrics b { color: #e6e9f5; }
  .compat { padding: 10px 12px 12px; }
  .compat h2 { margin: 0 0 8px; font-size: 12px; }
  .compat p { margin: 0 0 8px; color: #8b93b5; font-size: 11px; }
  .compat-grid { display: flex; flex-wrap: wrap; gap: 5px; }
  .feature { padding: 3px 7px; border-radius: 4px; font: 10px/1.4 ui-monospace, monospace; }
  .feature.ok { background: #052e1a; color: #a7f3d0; }
  .feature.no { background: #4c0519; color: #fecdd3; }
  .report-button {
    padding: 4px 9px; border: 1px solid #2a3150; border-radius: 6px;
    background: #151a2e; color: #e6e9f5; font: inherit; cursor: pointer;
  }

  .findings { padding: 14px; display: grid; gap: 8px; }
  .f {
    display: grid; grid-template-columns: 74px 130px 1fr; gap: 12px; align-items: start;
    padding: 9px 12px; border: 1px solid #2a3150; border-radius: 9px; background: #151a2e;
    font-size: 12px; line-height: 1.75;
  }
  .f.fail { border-color: #7f1d3a; }
  .f.warn { border-color: #78350f; }
  .f .sev { font-weight: 800; }
  .f.fail .sev { color: #fb7185; }
  .f.warn .sev { color: #fbbf24; }
  .f .who { color: #8b93b5; font-family: ui-monospace, SFMono-Regular, monospace; }
  .f .msg { color: #e6e9f5; }
  .f .why { color: #8b93b5; }

  /*
   * 測定用の領域。
   * 窓の幅に合わせると、窓が畳まれている環境では幅が 0 になって測定が総崩れになる。
   * 大きさを固定すれば、窓の状態にも画面の広さにも左右されない。
   * 同じ寸法で測れることは、あとで別の環境と結果を突き合わせる前提でもある。
   */
  .probe { padding: 0 14px 40px; }
  .probe .sheet {
    width: 1200px;
    grid-template-columns: repeat(8, 140px);
  }
  .probe .stage { height: 110px; }
</style>
</head>
<body>

<div class="vbar">
  <b>検証</b>
  <a href="contact.html">評価</a>
  <a href="strip.html">ストリップ</a>
  <a class="current" href="verify.html" aria-current="page">検証</a>
  <span id="status">読み込み中…</span>
  <div class="tally" id="tally"></div>
  <span class="spacer"></span>
  <label><input type="checkbox" id="showProbe"> 測定用の描画を見る</label>
  <button class="report-button" id="exportReport" type="button" disabled>結果JSON</button>
</div>

<div class="metrics" id="metrics" aria-live="polite"></div>
<section class="compat" aria-labelledby="compat-title">
  <h2 id="compat-title">ブラウザ機能マトリクス</h2>
  <p id="browser"></p>
  <div class="compat-grid" id="compat-grid"></div>
</section>
<div class="findings" id="findings"></div>
<div class="probe" id="probe" hidden><div class="sheet" id="sheet"></div></div>

<script type="module">
import {
  API, DUR, loadCatalog, injectStyles, buildCell, afterStyleResolution,
  isCssAnimation, reportFailures, showFatal,
} from './lab.js';
// 検査そのものは共有モジュールが持つ。CLI（bin/csslab.mjs）も同じものを呼ぶ。
// 静的検査は DOM を使わないので Node からも動く。実行時検査はブラウザ専用。
import { HARNESS_CLASSES, staticChecks } from '../scripts/checks/static.mjs';
import { inspect, seekOnly } from '../scripts/checks/runtime.mjs';

reportFailures();

const findings = [];
const add = (sev, id, rule, msg, why) => findings.push({ sev, id, rule, msg, why });
const startedAt = performance.now();

const featureChecks = [
  ['linear-easing', 'linear()', CSS.supports('animation-timing-function', 'linear(0, 1)')],
  ['individual-transform', 'translate/rotate/scale', CSS.supports('translate', '1px')],
  ['animation-composition', 'animation-composition', CSS.supports('animation-composition', 'add')],
  ['scroll-timeline', 'animation-timeline: scroll()', CSS.supports('animation-timeline', 'scroll()')],
  ['view-timeline', 'animation-timeline: view()', CSS.supports('animation-timeline', 'view()')],
  ['view-transition', 'View Transitions', typeof document.startViewTransition === 'function'],
  ['interpolate-size', 'interpolate-size', CSS.supports('interpolate-size', 'allow-keywords')],
  ['sibling-index', 'sibling-index()', CSS.supports('animation-delay', 'calc(sibling-index() * 1ms)')],
  ['corner-shape', 'corner-shape', CSS.supports('corner-shape', 'squircle')],
  ['scroll-state', 'scroll-state container', CSS.supports('container-type', 'scroll-state')],
  ['css-d', 'CSS d:path()', CSS.supports('d', 'path("M0 0 L1 1")')],
  ['mask-composite', 'mask-composite', CSS.supports('mask-composite', 'exclude')],
];
const browserLabel = navigator.userAgentData?.brands?.map((entry) => `${entry.brand} ${entry.version}`).join(', ')
  ?? navigator.userAgent;
document.querySelector('#browser').textContent = browserLabel;
document.querySelector('#compat-grid').innerHTML = featureChecks.map(([id, label, supported]) =>
  `<span class="feature ${supported ? 'ok' : 'no'}" data-feature="${id}">${supported ? '✓' : '×'} ${label}</span>`
).join('');

/* ───────────────────────── 実行時の検査 ───────────────────────── */

/**
 * 描画が止まっている環境では requestAnimationFrame が来ないので、
 * アニメーションが生成されるまで時間で待つ。
 */
async function waitForAnimations(tries = 20) {
  for (let i = 0; i < tries; i++) {
    if (document.getAnimations().some(isCssAnimation)) return true;
    await new Promise((r) => setTimeout(r, 100));
  }
  return false;
}

const yieldToPage = () => new Promise((r) => setTimeout(r, 0));

/* ───────────────────────── 実行 ───────────────────────── */

try {
  const status = document.querySelector('#status');
  const items = await loadCatalog();
  status.textContent = `${items.length} 件を検査中…`;

  const sources = await fetch(API.sources).then((r) => {
    if (!r.ok) throw new Error(`CSS ソースを取得できません（HTTP ${r.status}）`);
    return r.json();
  });
  const cssList = items.map((it) => sources[it.id] ?? '');

  const cssOf = new Map(items.map((it, i) => [it.id, cssList[i]]));
  items.forEach((it, i) => findings.push(...staticChecks(it, cssList[i], HARNESS_CLASSES)));

  await injectStyles(items);
  const sheet = document.querySelector('#sheet');
  const cells = new Map();
  for (const it of items) {
    const cell = buildCell(it, { tabbable: false });
    sheet.append(cell);
    cells.set(it.id, cell);
  }
  document.querySelector('#probe').hidden = false;
  await waitForAnimations();

  /*
   * 描画領域に幅が無いと、すべての要素が「入れ物より大きい」ことになり、
   * 位置や大きさを見る判定が総崩れになる。測れないことを黙って通すと、
   * 実験ではなく環境の問題を 100 件の指摘として報告してしまう。
   */
  // 窓が開くのが遅れることがある。一度きりの測定だと 0 を掴んで全判定が止まる。
  let probeWidth = 0;
  for (let i = 0; i < 20; i++) {
    probeWidth = sheet.getBoundingClientRect().width;
    if (probeWidth >= 80) break;
    await new Promise((r) => setTimeout(r, 250));
  }
  const measurable = probeWidth >= 80;
  if (!measurable) {
    add('warn', '（環境）', '測定不能',
      `描画領域の幅が ${Math.round(probeWidth)}px しかない`,
      '位置と大きさを見る判定は行わない。窓を広げて開き直す。');
  }

  let done = 0;
  const untested = new Set();
  const costClass = new Map();
  let animationCount = 0;

  for (const it of items) {
    if (++done % 20 === 0) {
      status.textContent = `${done} / ${items.length} 件`;
      await yieldToPage();
    }

    // R1〜R7 と負荷分類は共有モジュールが持つ。CLI も同じものを呼ぶ。
    const cell = cells.get(it.id);
    const result = inspect(cell, {
      id: it.id,
      css: cssOf.get(it.id) ?? '',
      duration: DUR,
      measurable,
      clockDriven: !it.mode,
    });
    findings.push(...result.findings);
    costClass.set(it.id, { cost: result.cost, properties: result.properties });
    animationCount += result.animationCount;

    // 状態・スクロール・操作で動くものは時計では測れない。「問題なし」とは分けて数える。
    if (it.mode) { untested.add(it.id); continue; }
    if (!measurable || !result.timed.length) continue;
    const timed = result.timed;

    // R8 実験が宣言した意図（meta.json の expect）
    //
    // 「動いているか」は測れても「意図どおりか」は測れない。
    // 意図は書いてもらうしかないので、実際に踏んだ不具合から言い回しを 5 つに絞った。
    for (const e of it.expect ?? []) {
      const pct = (v) => (DUR * parseFloat(v)) / 100;
      const seekTo = (v) => seekOnly(timed, pct(v));
      const pick = (sel) => [...cell.querySelectorAll(`.stage ${sel}`)];
      const box = (el) => el.getBoundingClientRect();
      const ctr = (el) => { const r = box(el); return [r.left + r.width / 2, r.top + r.height / 2]; };
      const label = JSON.stringify(e).slice(0, 60);

      try {
        if (e.still) {
          // 指定した区間で完全に動かないこと。時間停止のような「同時性」の検査。
          const [a, b] = e.between;
          const shots = [0, 0.25, 0.5, 0.75, 1].map((k) => {
            seekTo(`${parseFloat(a) + (parseFloat(b) - parseFloat(a)) * k}%`);
            return pick(e.still).map((el) => { const r = box(el); return `${Math.round(r.left)},${Math.round(r.top)}`; }).join('|');
          });
          if (new Set(shots).size !== 1) {
            add('fail', it.id, '意図（静止）', `${e.still} が ${a}〜${b} で動いている`, label);
          }
        } else if (e.side) {
          seekTo(e.at);
          const [a] = pick(e.of);
          const [b] = pick(e.from);
          if (!a || !b) throw new Error('要素が無い');
          const [ax] = ctr(a), [bx] = ctr(b);
          const [, ay] = ctr(a), [, by] = ctr(b);
          const ok = { left: ax < bx, right: ax > bx, above: ay < by, below: ay > by }[e.side];
          if (!ok) add('fail', it.id, '意図（位置関係）', `${e.at} で ${e.of} が ${e.from} の ${e.side} に無い`, label);
        } else if (e.near) {
          seekTo(e.at ?? '50%');
          const [a] = pick(e.near[0]);
          const [b] = pick(e.near[1]);
          if (!a || !b) throw new Error('要素が無い');
          const [ax, ay] = ctr(a), [bx, by] = ctr(b);
          const d = Math.hypot(ax - bx, ay - by);
          if (d > e.within) {
            add('fail', it.id, '意図（近接）', `${e.near.join(' と ')} が ${d.toFixed(0)}px 離れている（許容 ${e.within}）`, label);
          }
        } else if (e.inside) {
          seekTo(e.at ?? '50%');
          const [a] = pick(e.inside);
          const [c] = e.within_of ? pick(e.within_of) : [cell.querySelector('.stage')];
          if (!a || !c) throw new Error('要素が無い');
          const r = box(a), q = box(c), M = 2;
          if (r.left < q.left - M || r.right > q.right + M || r.top < q.top - M || r.bottom > q.bottom + M) {
            add('fail', it.id, '意図（収まり）', `${e.inside} が入れ物からはみ出している`, label);
          }
        } else if (e.ordered) {
          seekTo(e.at ?? '50%');
          const els = pick(e.ordered);
          const key = e.by === 'left' ? 0 : 1;
          const vs = els.map((el) => Math.round(box(el)[e.by === 'left' ? 'left' : 'top']));
          const rising = vs.every((v, i) => i === 0 || v > vs[i - 1] + 1);
          if (!rising) add('fail', it.id, '意図（並び）', `${e.ordered} が ${e.by ?? 'top'} 順に並んでいない（${vs.join(',')}）`, label);
        }
      } catch (err) {
        add('warn', it.id, '意図（検査できず）', String(err.message), label);
      }
    }
    seekOnly(timed, 0);
  }

  /* ───── 表示 ───── */
  const order = { fail: 0, warn: 1 };
  findings.sort((a, b) => order[a.sev] - order[b.sev] || a.id.localeCompare(b.id));

  const box = document.querySelector('#findings');
  box.innerHTML = findings.map((f) => `
    <div class="f ${f.sev}">
      <span class="sev">${f.sev === 'fail' ? '要修正' : '注意'}</span>
      <span class="who">${f.id}<br><span style="opacity:.7">${f.rule}</span></span>
      <span><span class="msg">${f.msg}</span><br><span class="why">${f.why}</span></span>
    </div>`).join('') || '<div class="f"><span class="sev">—</span><span></span><span>指摘なし</span></div>';

  const nFail = findings.filter((f) => f.sev === 'fail').length;
  const nWarn = findings.length - nFail;
  const findingIds = new Set(findings.map((f) => f.id));
  const nUntested = [...untested].filter((id) => !findingIds.has(id)).length;
  const nOk = items.length - new Set([...findingIds, ...untested]).size;
  document.querySelector('#tally').innerHTML =
    `<span class="t-fail">要修正 ${nFail}</span>` +
    `<span class="t-warn">注意 ${nWarn}</span>` +
    `<span class="t-skip">実行時未検証 ${nUntested}</span>` +
    `<span class="t-ok">問題なし ${nOk}</span>`;
  status.textContent = `${items.length} 件`;

  const costCounts = {};
  for (const entry of costClass.values()) costCounts[entry.cost] = (costCounts[entry.cost] ?? 0) + 1;
  const elapsedMs = Math.round(performance.now() - startedAt);
  const cssBytes = Object.values(sources).reduce((sum, css) => sum + new Blob([css]).size, 0);
  document.querySelector('#metrics').innerHTML = [
    `<span>アニメーション <b>${animationCount}</b> 本</span>`,
    `<span>合成候補 <b>${costCounts.compositor ?? 0}</b> 件</span>`,
    `<span>paint候補 <b>${costCounts.paint ?? 0}</b> 件</span>`,
    `<span>layout候補 <b>${costCounts.layout ?? 0}</b> 件</span>`,
    `<span>分類不能 <b>${costCounts.unknown ?? 0}</b> 件</span>`,
    `<span>CSS <b>${Math.round(cssBytes / 1024)}</b> KiB</span>`,
    `<span>検証 <b>${elapsedMs}</b> ms</span>`,
  ].join('');

  document.querySelector('#showProbe').addEventListener('change', (e) => {
    document.querySelector('#probe').style.display = e.target.checked ? '' : 'none';
  });
  document.querySelector('#probe').style.display = 'none';

  window.__report = {
    version: 1,
    generatedAt: new Date().toISOString(),
    browser: browserLabel,
    total: items.length,
    findings,
    runtimeUntested: [...untested],
    measurable,
    probeWidth: Math.round(probeWidth),
    elapsedMs,
    animationCount,
    featureChecks: Object.fromEntries(featureChecks.map(([id, , supported]) => [id, supported])),
    costClass: Object.fromEntries(costClass),
  };
  const exportButton = document.querySelector('#exportReport');
  exportButton.disabled = false;
  exportButton.addEventListener('click', () => {
    const blob = new Blob([`${JSON.stringify(window.__report, null, 2)}\n`], { type: 'application/json' });
    const href = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = href;
    link.download = `browser-report-${Date.now()}.json`;
    link.click();
    URL.revokeObjectURL(href);
  });
} catch (err) {
  showFatal(err);
}
</script>
</body>
</html>
