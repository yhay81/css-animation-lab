# 公開サイトのデプロイ（Cloudflare Workers）。
#
# 判定を書き戻せないため、サイトは読み取り専用として組む（api/config.json の readonly）。
# 判定はブラウザの中にだけ残り、書き出してプルリクエストで送る形になる。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同時実行を1本に絞る。走行中のデプロイは止めない。
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 壊れたものを公開しない。CI と同じ検査をここでも通す。
      - run: npm test
      - run: npm run validate
      - run: npm run build:site

      # wrangler は開発依存にも入れない。配信のためだけに必要なものを
      # リポジトリの依存に混ぜると「依存ゼロ」が崩れる。
      - run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
