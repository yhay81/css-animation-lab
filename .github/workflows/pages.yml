# 公開サイトのデプロイ。
#
# 判定を書き戻せないため、サイトは読み取り専用として組む（api/config.json の readonly）。
# 判定はブラウザの中にだけ残り、書き出してプルリクエストで送る形になる。
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同時実行を1本に絞る。走行中のデプロイは止めない。
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 壊れたものを公開しない。CI と同じ検査をここでも通す。
      - run: npm test
      - run: npm run validate
      - run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
